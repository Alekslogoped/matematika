<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<title>Математическая раскраска</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden;font-family:Arial,sans-serif}
body{
  background:#f4e7cf url("fon.png") center center/cover no-repeat;
}
#game{position:relative;width:100vw;height:100vh;min-height:430px;overflow:hidden}
.title{
 position:absolute;top:2%;left:50%;transform:translateX(-50%);
 background:rgba(255,255,255,.90);padding:8px 22px;border-radius:22px;
 font-weight:900;font-size:clamp(18px,2.4vw,32px);color:#5b3825;
 box-shadow:0 4px 14px #0002;z-index:20;white-space:nowrap
}
.board{
 position:absolute;left:52%;top:48%;transform:translate(-50%,-50%);
 height:min(78vh,760px);aspect-ratio:788/708;
}
canvas{width:100%;height:100%;display:block;cursor:pointer}
.palette{
 position:absolute;left:2.5%;top:50%;transform:translateY(-50%);
 display:grid;grid-template-columns:repeat(2,88px);gap:12px;
 padding:15px;background:rgba(255,255,255,.91);border-radius:25px;
 box-shadow:0 6px 20px #0003;z-index:30
}
.swatch{
 width:88px;height:70px;border:4px solid #fff;border-radius:18px;
 box-shadow:0 3px 9px #0003;font-size:27px;font-weight:900;cursor:pointer;
 color:#332820
}
.swatch.selected{outline:5px solid #45382f;transform:scale(1.08)}
#msg{
 position:absolute;left:50%;top:11%;transform:translateX(-50%);
 background:white;padding:9px 18px;border-radius:18px;font-weight:900;
 opacity:0;z-index:40;transition:.2s;white-space:nowrap
}
#msg.show{opacity:1}
#next{
 position:absolute;right:3%;bottom:5%;display:none;border:0;border-radius:22px;
 padding:14px 25px;background:#fff;font-size:21px;font-weight:900;
 box-shadow:0 5px 18px #0003;cursor:pointer;z-index:45
}
#next.show{display:block}
.spark{
 position:absolute;top:-25px;width:11px;height:17px;border-radius:3px;
 z-index:42;animation:fall 2.5s linear forwards;pointer-events:none
}
@keyframes fall{to{transform:translate(var(--d),110vh) rotate(720deg);opacity:.8}}
@media(max-width:850px){
 .title{top:1%;font-size:18px}
 .board{left:58%;height:min(72vh,650px)}
 .palette{left:1%;grid-template-columns:72px;padding:9px;gap:7px}
 .swatch{width:72px;height:53px;font-size:22px}
}
</style>
</head>
<body>
<div id="game">
 <div class="title">Реши пример и раскрась белочку 🍂</div>
 <div id="msg"></div>

 <div class="board">
   <canvas id="canvas"></canvas>
 </div>

 <div class="palette">
   <button class="swatch" data-a="8" data-c="#ff7a00" style="background:#ff7a00">8</button>
   <button class="swatch" data-a="1" data-c="#f8bfd0" style="background:#f8bfd0">1</button>
   <button class="swatch" data-a="7" data-c="#ffc58f" style="background:#ffc58f">7</button>
   <button class="swatch" data-a="6" data-c="#e89532" style="background:#e89532">6</button>
   <button class="swatch" data-a="2" data-c="#bfc2c5" style="background:#bfc2c5">2</button>
   <button class="swatch" data-a="3" data-c="#9a633d" style="background:#9a633d;color:white">3</button>
 </div>

 <button id="next">ЕЩЁ РАЗ ↻</button>
</div>

<script>
const canvas=document.getElementById('canvas');
const ctx=canvas.getContext('2d',{willReadFrequently:true});
const msg=document.getElementById('msg');
const next=document.getElementById('next');
const game=document.getElementById('game');
const buttons=[...document.querySelectorAll('.swatch')];

let selected=null;
let completed=new Set();
let finished=false;

const img=new Image();
img.src='images/01.png?v=2';
img.onload=()=>{
 canvas.width=img.naturalWidth;
 canvas.height=img.naturalHeight;
 ctx.clearRect(0,0,canvas.width,canvas.height);
 ctx.drawImage(img,0,0);
};

// Кликабельные области под примеры на белочке.
// Один и тот же ответ может встречаться в нескольких местах.
const zones=[
 {id:'earLouter',a:'8',x1:.43,y1:.00,x2:.58,y2:.18},
 {id:'earLinner',a:'1',x1:.40,y1:.11,x2:.51,y2:.31},
 {id:'head',     a:'7',x1:.48,y1:.20,x2:.70,y2:.47},
 {id:'earRouter',a:'8',x1:.67,y1:.07,x2:.84,y2:.28},
 {id:'earRinner',a:'1',x1:.71,y1:.18,x2:.82,y2:.36},
 {id:'tail',     a:'6',x1:.72,y1:.30,x2:.99,y2:.87},
 {id:'chest',    a:'2',x1:.49,y1:.54,x2:.67,y2:.76},
 {id:'acorn',    a:'3',x1:.38,y1:.61,x2:.56,y2:.81},
 {id:'leg',      a:'6',x1:.57,y1:.73,x2:.80,y2:.98},
 {id:'paw',      a:'6',x1:.38,y1:.87,x2:.58,y2:.99}
];

buttons.forEach(b=>b.addEventListener('click',()=>{
 selected={answer:b.dataset.a,color:b.dataset.c};
 buttons.forEach(x=>x.classList.remove('selected'));
 b.classList.add('selected');
}));

canvas.addEventListener('click',e=>{
 if(finished)return;
 if(!selected){flash('Сначала выбери цвет 🎨');return}

 const r=canvas.getBoundingClientRect();
 const x=(e.clientX-r.left)/r.width;
 const y=(e.clientY-r.top)/r.height;

 // Если зоны немного пересекаются, выбираем самую маленькую подходящую.
 const matches=zones.filter(z=>x>=z.x1&&x<=z.x2&&y>=z.y1&&y<=z.y2&&!completed.has(z.id));
 if(!matches.length){flash('Нажми на область с примером 😊');return}
 matches.sort((p,q)=>((p.x2-p.x1)*(p.y2-p.y1))-((q.x2-q.x1)*(q.y2-q.y1)));
 const z=matches[0];

 if(selected.answer!==z.a){flash('Проверь пример — нужен другой цвет 😊');return}

 const px=Math.floor(x*canvas.width);
 const py=Math.floor(y*canvas.height);
 const ok=floodFill(px,py,selected.color);
 if(!ok){flash('Нажми на белое место рядом с примером');return}

 completed.add(z.id);
 if(completed.size===zones.length)finish();
});

function hexRgb(h){
 return [parseInt(h.slice(1,3),16),parseInt(h.slice(3,5),16),parseInt(h.slice(5,7),16)];
}

function floodFill(sx,sy,hex){
 const w=canvas.width,h=canvas.height;
 const im=ctx.getImageData(0,0,w,h),d=im.data;
 const start=(sy*w+sx)*4;
 const tr=d[start],tg=d[start+1],tb=d[start+2],ta=d[start+3];

 // Прозрачный фон не красим; черные линии тоже не красим.
 if(ta<80 || tr<145 || tg<145 || tb<145)return false;

 const [nr,ng,nb]=hexRgb(hex);
 const seen=new Uint8Array(w*h);
 const stack=[sx,sy];
 const tol=85;
 let painted=0;

 while(stack.length){
   const y=stack.pop(),x=stack.pop();
   if(x<0||y<0||x>=w||y>=h)continue;
   const n=y*w+x;
   if(seen[n])continue;
   seen[n]=1;
   const i=n*4,r=d[i],g=d[i+1],b=d[i+2],a=d[i+3];

   if(a<80)continue;
   if(r<125||g<125||b<125)continue;
   if(Math.abs(r-tr)>tol||Math.abs(g-tg)>tol||Math.abs(b-tb)>tol)continue;

   d[i]=nr; d[i+1]=ng; d[i+2]=nb; d[i+3]=a;
   painted++;
   stack.push(x+1,y,x-1,y,x,y+1,x,y-1);
 }
 if(painted<20)return false;
 ctx.putImageData(im,0,0);
 return true;
}

function flash(t){
 msg.textContent=t;msg.classList.add('show');
 clearTimeout(window._m);
 window._m=setTimeout(()=>msg.classList.remove('show'),1250);
}

function finish(){
 finished=true;
 const colors=['#ff7a00','#f8bfd0','#ffc58f','#e89532','#bfc2c5','#9a633d'];
 for(let i=0;i<110;i++){
   const s=document.createElement('i');
   s.className='spark';
   s.style.left=Math.random()*100+'%';
   s.style.background=colors[Math.floor(Math.random()*colors.length)];
   s.style.setProperty('--d',(Math.random()*260-130)+'px');
   s.style.animationDelay=Math.random()*.8+'s';
   game.appendChild(s);
   setTimeout(()=>s.remove(),3600);
 }
 flash('Ура! Белочка раскрашена! ✨');
 setTimeout(()=>next.classList.add('show'),650);
}

next.onclick=()=>location.reload();
</script>
</body>
</html>
