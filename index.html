<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<title>Математическая раскраска — Лисичка</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden;font-family:Arial,sans-serif}
#game{position:relative;width:100vw;height:100vh;min-height:420px;background:linear-gradient(#fffaf0,#f3ead9);overflow:hidden}
header{position:absolute;top:1.5%;left:0;right:0;text-align:center;z-index:20}
h1{margin:0;color:#493d38;font-size:clamp(20px,3vw,36px)}
header div{margin-top:4px;color:#75645b;font-size:clamp(12px,1.5vw,17px)}
.board{position:absolute;left:50%;top:48%;transform:translate(-50%,-50%);width:min(68vw,700px);aspect-ratio:1/1}
canvas{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;cursor:pointer}
.palette{position:absolute;left:50%;bottom:2%;transform:translateX(-50%);display:flex;gap:12px;padding:10px 15px;background:#ffffffea;border-radius:22px;box-shadow:0 4px 18px #0002;z-index:30}
.swatch{width:clamp(52px,7vw,76px);height:clamp(52px,7vw,76px);border:4px solid white;border-radius:18px;box-shadow:0 2px 8px #0003;font-size:clamp(21px,2.7vw,31px);font-weight:900;cursor:pointer}
.swatch.selected{outline:4px solid #333;transform:translateY(-6px)}
#msg{position:absolute;left:50%;top:12%;transform:translateX(-50%);padding:8px 16px;background:white;border-radius:18px;font-weight:800;opacity:0;z-index:40;transition:.2s;white-space:nowrap}
#msg.show{opacity:1}
#next{position:absolute;right:4%;bottom:5%;z-index:45;display:none;border:0;border-radius:20px;padding:14px 25px;background:white;font-size:21px;font-weight:900;box-shadow:0 5px 18px #0003;cursor:pointer}
#next.show{display:block;animation:pop .4s}
@keyframes pop{0%{transform:scale(.3)}80%{transform:scale(1.1)}100%{transform:scale(1)}}
.spark{position:absolute;top:-25px;width:10px;height:17px;border-radius:3px;z-index:42;animation:fall 2.4s linear forwards;pointer-events:none}
@keyframes fall{to{transform:translate(var(--d),110vh) rotate(720deg);opacity:.8}}
@media(max-width:700px){.board{width:92vw;top:47%}.palette{gap:8px;padding:8px 10px}#next{right:2%;bottom:13%}}
</style>
</head>
<body>
<div id="game">
<header><h1>Математическая раскраска</h1><div>Реши пример → выбери цвет с ответом → нажми на нужную часть лисички</div></header>
<div id="msg"></div>

<div class="board"><canvas id="canvas" width="1024" height="1024"></canvas></div>

<div class="palette">
<button class="swatch" data-a="5" data-c="#f6a6b7" style="background:#f6a6b7">5</button>
<button class="swatch" data-a="6" data-c="#8fc7ff" style="background:#8fc7ff">6</button>
<button class="swatch" data-a="8" data-c="#ffd66e" style="background:#ffd66e">8</button>
</div>
<button id="next">ДАЛЬШЕ →</button>
</div>

<script>
const canvas=document.getElementById('canvas'),ctx=canvas.getContext('2d',{willReadFrequently:true});
const msg=document.getElementById('msg'),next=document.getElementById('next'),game=document.getElementById('game');
const buttons=[...document.querySelectorAll('.swatch')];
let selected=null,finished=false,done=new Set();

const img=new Image();
img.src='images/fox.png?v=4';
img.onload=()=>{canvas.width=img.naturalWidth;canvas.height=img.naturalHeight;ctx.drawImage(img,0,0)};

// Кликабельные части лисы. Координаты даны в долях изображения.
const zones=[
 {id:'leftEar', answer:'5', poly:[[.10,.31],[.10,.08],[.17,.02],[.34,.20],[.22,.30]]},
 {id:'rightEar',answer:'6', poly:[[.49,.19],[.68,.04],[.72,.13],[.69,.31],[.60,.32]]},
 {id:'head',    answer:'5', poly:[[.17,.22],[.31,.15],[.48,.16],[.62,.25],[.65,.39],[.58,.49],[.42,.54],[.27,.51],[.14,.42],[.12,.31]]},
 {id:'chest',   answer:'6', poly:[[.25,.52],[.43,.52],[.45,.62],[.40,.72],[.32,.79],[.25,.72],[.23,.61]]},
 {id:'body',    answer:'5', poly:[[.43,.53],[.56,.57],[.65,.68],[.67,.82],[.60,.93],[.48,.96],[.37,.90],[.42,.77]]},
 {id:'tail',    answer:'8', poly:[[.63,.66],[.70,.53],[.81,.44],[.93,.40],[.90,.53],[.93,.66],[.87,.80],[.76,.89],[.65,.86],[.68,.76]]}
];

buttons.forEach(b=>b.onclick=()=>{
 selected={a:b.dataset.a,c:b.dataset.c};
 buttons.forEach(x=>x.classList.remove('selected'));b.classList.add('selected');
});

canvas.addEventListener('click',e=>{
 if(finished)return;
 if(!selected){flash('Сначала выбери цвет 🎨');return}
 const r=canvas.getBoundingClientRect();
 const x=(e.clientX-r.left)/r.width, y=(e.clientY-r.top)/r.height;
 const z=zones.find(q=>pointInPoly(x,y,q.poly));
 if(!z){flash('Нажми на часть лисички 😊');return}
 if(done.has(z.id))return;
 if(selected.a!==z.answer){flash('Попробуй другой цвет 😊');return}

 // Настоящая заливка белой области непосредственно в PNG на canvas.
 const px=Math.round(x*canvas.width), py=Math.round(y*canvas.height);
 floodFill(px,py,selected.c);
 done.add(z.id);
 if(done.size===zones.length)finish();
});

function pointInPoly(x,y,p){
 let inside=false;
 for(let i=0,j=p.length-1;i<p.length;j=i++){
  const xi=p[i][0],yi=p[i][1],xj=p[j][0],yj=p[j][1];
  const hit=((yi>y)!=(yj>y))&&(x<(xj-xi)*(y-yi)/(yj-yi)+xi);
  if(hit)inside=!inside;
 }
 return inside;
}

function hexRgb(h){return [parseInt(h.slice(1,3),16),parseInt(h.slice(3,5),16),parseInt(h.slice(5,7),16)]}

function floodFill(sx,sy,hex){
 const w=canvas.width,h=canvas.height;
 const im=ctx.getImageData(0,0,w,h),d=im.data,[nr,ng,nb]=hexRgb(hex);
 const p=(sy*w+sx)*4,tr=d[p],tg=d[p+1],tb=d[p+2];
 // Клик должен попасть в светлую область.
 if(tr<150||tg<150||tb<150){flash('Нажми на белую часть рядом с примером');return}
 const seen=new Uint8Array(w*h), stack=[[sx,sy]];
 const tol=75;
 while(stack.length){
  const [x,y]=stack.pop(); if(x<0||y<0||x>=w||y>=h)continue;
  const n=y*w+x;if(seen[n])continue;seen[n]=1;
  const i=n*4,r=d[i],g=d[i+1],b=d[i+2];
  if(Math.abs(r-tr)>tol||Math.abs(g-tg)>tol||Math.abs(b-tb)>tol)continue;
  // Сохраняем антиалиасинг: очень темные линии сюда не проходят.
  d[i]=nr;d[i+1]=ng;d[i+2]=nb;d[i+3]=255;
  stack.push([x+1,y],[x-1,y],[x,y+1],[x,y-1]);
 }
 ctx.putImageData(im,0,0);
}

function flash(t){msg.textContent=t;msg.classList.add('show');clearTimeout(window.m);window.m=setTimeout(()=>msg.classList.remove('show'),1200)}
function finish(){
 finished=true;
 const colors=['#ffd66e','#f6a6b7','#8fc7ff','#9fddae','#c9a8ef','#ffb36b'];
 for(let i=0;i<100;i++){const s=document.createElement('i');s.className='spark';s.style.left=Math.random()*100+'%';s.style.background=colors[Math.floor(Math.random()*colors.length)];s.style.setProperty('--d',(Math.random()*240-120)+'px');s.style.animationDelay=Math.random()*.7+'s';game.appendChild(s);setTimeout(()=>s.remove(),3400)}
 flash('Ура! Лисичка раскрашена! ✨');setTimeout(()=>next.classList.add('show'),650);
}
next.onclick=()=>location.reload();
</script>
</body>
</html>
